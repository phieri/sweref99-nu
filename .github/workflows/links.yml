name: Check Links

on:
  schedule:
    # Run late Saturday nights at 23:00 UTC
    - cron: '0 23 * * 6'
  workflow_dispatch:  # Allow manual triggering
  pull_request:
    paths:
      - '**.md'
      - '**.html'
      - '.github/workflows/links.yml'

jobs:
  link-checker:
    name: Check all links
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/lychee
          key: lychee-cache-${{ github.run_id }}
          restore-keys: |
            lychee-cache-

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Check repo markdown and HTML files, while excluding generated-only site assets.
          args: >-
            --verbose --no-progress --accept 200,204,403,429
            --cache --base-url https://sweref99.nu/ --root-dir "$GITHUB_WORKSPACE/_site"
            --exclude '\.md$'
            --exclude '^(https://sweref99.nu/)?(app\.webmanifest|favicon\.ico|icon-192\.png|icon-512\.png|apple-touch-icon\.png|pico\.min\.css|stil\.css|images/splash-iphone.*)$'
            '**/*.md' '**/*.html'
          # Fail workflow on broken links
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
