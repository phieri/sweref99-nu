name: Build all

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install test dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Cache rendered icons
        id: icon-cache
        uses: actions/cache@v6
        with:
          path: |
            _site/favicon.ico
            _site/apple-touch-icon.png
            _site/icon-192.png
            _site/icon-512.png
            _site/images/splash-iphone.png
            _site/images/splash-iphone-plus.png
            _site/images/splash-iphone-se.png
            _site/images/splash-iphone-landscape.png
          key: ${{ runner.os }}-icons-${{ hashFiles('src/icon.svg') }}
      - name: Install icon generation tools
        if: steps.icon-cache.outputs.cache-hit != 'true'
        run: sudo apt-get -qq update && sudo apt-get install -q -y librsvg2-bin imagemagick
      - run: |
          echo "=== Building TypeScript ==="
          make script.js
          if [ "${{ steps.icon-cache.outputs.cache-hit }}" != "true" ]; then
            echo "=== Generating icons ==="
            make icons
          else
            echo "=== Icons restored from cache ==="
          fi
          echo "=== Final _site contents ==="
          ls -la _site/
          echo "=== Adding additional files ==="
          echo "${{ vars.adstxt }}" > _site/ads.txt
          curl --fail --show-error --location -o _site/pico.min.css https://raw.githubusercontent.com/picocss/pico/v2.1.1/css/pico.min.css
          release_tag='v2.21.0'
          release_asset_url="https://github.com/proj4js/proj4js/releases/download/${release_tag}/dist.zip"
          echo "Downloading PROJ4JS release $release_tag"
          curl --fail --show-error --location -o /tmp/proj4-dist.zip "$release_asset_url"
          env release_tag="$release_tag" python - <<'PY'
          import os
          import shutil
          import zipfile

          with zipfile.ZipFile("/tmp/proj4-dist.zip") as archive:
              matches = [
                  name
                  for name in archive.namelist()
                  if name in {"proj4.js", "dist/proj4.js"} or name.endswith("/proj4.js")
              ]
              if not matches:
                  raise SystemExit("Could not locate proj4.js inside the dist.zip archive")

              preferred = next((name for name in matches if name == "dist/proj4.js"), None)
              if preferred is None:
                  preferred = next((name for name in matches if name == "proj4.js"), None)
              if preferred is None and len(matches) == 1:
                  preferred = matches[0]
              if preferred is None:
                  raise SystemExit("Found multiple proj4.js entries but none matched a known path")

              archive.extract(preferred, "/tmp/proj4-release")
              extracted_path = os.path.join("/tmp/proj4-release", preferred)

          os.makedirs("_site", exist_ok=True)
          shutil.copyfile(extracted_path, "_site/proj4.js")
          print(f"Downloaded PROJ4JS release asset ({os.environ['release_tag']})")
          PY
          echo "=== Final _site contents ==="
          ls -la _site/
      - uses: actions/upload-pages-artifact@v5
  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
